<!DOCTYPE html>
<html>
<head>
<title>Análise de Séries - Versão Integrada</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; display:flex; height: 100vh; overflow: hidden; }
.sidebar { width:260px; background:#1e293b; padding:15px; border-right:1px solid #334155; display: flex; flex-direction: column; }
.sidebar h3 { margin-top:0; color: #38bdf8; }
.mode-selector { margin-bottom: 20px; padding: 10px; background: #0f172a; border-radius: 8px; }
.json-item { padding:10px; margin:5px 0; background:#334155; cursor:pointer; border-radius:5px; transition: 0.3s; }
.json-item:hover { background:#38bdf8; color: #0f172a; }
.main { flex:1; display:flex; flex-direction:column; overflow-y: auto; }
.topbar { padding:10px; background:#1e293b; display:flex; justify-content:space-between; align-items: center; border-bottom: 1px solid #334155; }
#info { padding:15px; background:#020617; border-bottom: 1px solid #334155; line-height: 1.6; }
#grafico { height:60vh; background: #000; position: relative; }
#tabela { padding: 10px; overflow:auto; background: #0f172a; }
table { width:100%; border-collapse:collapse; font-size: 13px; }
th, td { border:1px solid #334155; padding:8px; text-align:center; }
th { background: #1e293b; }
.btn-export { background: #0ea5e9; border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
</style>
</head>

<body>

<div class="sidebar">
  <h3>📂 Painel de Controle</h3>
  
  <div class="mode-selector">
    <label style="font-size: 12px; color: #94a3b8;">MODO DE ANÁLISE:</label><br>
    <select id="modoAjuste" style="width: 100%; margin-top: 5px; padding: 5px; background: #334155; color: white; border: none;">
      <option value="padrao">Padrão (Interpolação)</option>
      <option value="puro">Ajuste Puro (Sem Interp.)</option>
    </select>
  </div>

  <h3>📊 Séries</h3>
  <div id="lista" style="flex: 1; overflow-y: auto;"></div>
</div>

<div class="main">
  <div class="topbar">
    <span id="titulo-arquivo">Selecione um arquivo...</span>
    <button class="btn-export" onclick="exportar()">🖼️ Exportar PNG</button>
  </div>

  <div id="info">Clique em uma série para ver a análise matemática.</div>
  <div id="grafico"></div>
  <div id="tabela"></div>
</div>

<script>
const token = "123";
let rendererGlobal;
let cenaGlobal;
let cameraGlobal;

// Carregar lista de arquivos
fetch(`/lista_json?token=${token}`)
  .then(res=>res.json())
  .then(lista=>{
    const div = document.getElementById("lista");
    lista.forEach(nome=>{
      const el = document.createElement("div");
      el.className = "json-item";
      el.innerText = nome;
      el.onclick = () => carregarDados(nome);
      div.appendChild(el);
    });
  });

function carregarDados(nome) {
  const modo = document.getElementById("modoAjuste").value;
  // Define qual rota usar baseada no modo selecionado
  const url = modo === "puro" 
    ? `/api/ajuste-puro/${nome}?token=${token}` 
    : `/data/${nome}.json?token=${token}`;

  document.getElementById("titulo-arquivo").innerText = `Arquivo: ${nome} [${modo.toUpperCase()}]`;

  fetch(url)
    .then(res=>res.json())
    .then(data => desenhar(data, modo));
}

function desenhar(data, modo){
  const container = document.getElementById("grafico");
  container.innerHTML = "";

  const scene = new THREE.Scene();
  const width = container.clientWidth;
  const height = container.clientHeight;

  const camera = new THREE.PerspectiveCamera(75, width/height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true, antialias: true});
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  rendererGlobal = renderer;
  cenaGlobal = scene;
  cameraGlobal = camera;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  
  const x = data.x || data.pontos.x;
  const y = data.y || data.pontos.y;
  const {a, b, c} = data.coeficientes;
  const r2 = data.r2 || calcularR2Manual(x, y, a, b, c);

  const x_min = Math.min(...x);
  const x_max = Math.max(...x);
  camera.position.z = (x_max - x_min) * 1.5 + 5;

  // --- DESENHAR PONTOS (Esferas) ---
  x.forEach((xi, i)=>{
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.4),
      new THREE.MeshBasicMaterial({color: 0xff4444})
    );
    p.position.set(xi, y[i], 0);
    scene.add(p);
  });

  // --- DESENHAR CURVA (Ajuste de 2º Grau) ---
  // Mantemos a interpolação de 200 pontos para suavidade da linha visual
  let curvaPoints = [];
  const passos = 200; 
  for(let i=0; i<=passos; i++){
    let xi = x_min + (i/passos) * (x_max - x_min);
    let yi = a*xi*xi + b*xi + c;
    curvaPoints.push(new THREE.Vector3(xi, yi, 0));
  }

  const linhaCurva = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curvaPoints),
    new THREE.LineBasicMaterial({color: 0x38bdf8, linewidth: 2})
  );
  scene.add(linhaCurva);

  // --- ATUALIZAR INFO ---
  let tendencia = a > 0 ? "📈 Tendência de Crescimento/Melhora" : "📉 Tendência de Queda/Piora";
  if (modo === "puro") tendencia = "🎯 Ajuste Matemático Puro (Regressão)";

  document.getElementById("info").innerHTML = `
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div><b>Equação:</b> <span style="color:#38bdf8">y = ${a.toFixed(4)}x² + ${b.toFixed(4)}x + ${c.toFixed(4)}</span></div>
        <div><b>Coeficiente R²:</b> <span style="color:#10b981">${(r2 * 100).toFixed(2)}%</span></div>
    </div>
    <div style="margin-top: 5px;"><b>Análise:</b> ${tendencia}</div>
  `;

  // --- GERAR TABELA ---
  let htmlTabela = "<table><tr><th>X</th><th>Y Real</th><th>Y Previsto</th><th>Resíduo (Erro)</th></tr>";
  x.forEach((xi, i)=>{
    let prev = a*xi*xi + b*xi + c;
    let erro = y[i] - prev;
    htmlTabela += `<tr><td>${xi}</td><td>${y[i]}</td><td>${prev.toFixed(2)}</td><td style="color:${erro<0?'#f87171':'#10b981'}">${erro.toFixed(4)}</td></tr>`;
  });
  document.getElementById("tabela").innerHTML = htmlTabela + "</table>";

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

function calcularR2Manual(x, y, a, b, c) {
    let yMed = y.reduce((a,b)=>a+b)/y.length;
    let ssTot = y.reduce((s,v)=>s+(v-yMed)**2,0);
    let ssRes = x.reduce((s,xi,i)=>{
        let yi = a*xi*xi + b*xi + c;
        return s + (y[i]-yi)**2;
    },0);
    return 1 - (ssRes/ssTot);
}

function exportar(){
  if(!rendererGlobal) return;
  const link = document.createElement("a");
  link.download = "analise_grafico.png";
  link.href = rendererGlobal.domElement.toDataURL();
  link.click();
}

window.addEventListener('resize', () => {
    if(cameraGlobal && rendererGlobal) {
        const container = document.getElementById("grafico");
        cameraGlobal.aspect = container.clientWidth / container.clientHeight;
        cameraGlobal.updateProjectionMatrix();
        rendererGlobal.setSize(container.clientWidth, container.clientHeight);
    }
});
</script>

</body>
</html>
