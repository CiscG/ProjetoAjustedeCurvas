<!DOCTYPE html>
<html>
<head>
  <title>Ajuste de Curva</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body style="margin:0; background:black; color:white;">
<h2 style="position:absolute; top:10px; left:10px;">
  Pontos ligados (sem suavização)
</h2>

<script>

const arquivo_json = "{{ arquivo_json }}";

// ------------------ REQUISIÇÃO ------------------
fetch(arquivo_json)
  .then(res => res.json())
  .then(data => iniciarCena(data))
  .catch(err => console.error("Erro:", err));


// ------------------ FUNÇÃO PRINCIPAL ------------------
function iniciarCena(data) {

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const x_vals = data.x;
  const y_vals = data.y;

  const x_min = Math.min(...x_vals);
  const x_max = Math.max(...x_vals);
  const y_min = Math.min(...y_vals);
  const y_max = Math.max(...y_vals);

  const escala = Math.max(x_max - x_min, y_max - y_min);
  camera.position.z = escala * 2;

  // ---------- EIXOS ----------
  const materialEixo = new THREE.LineBasicMaterial({ color: 0xffffff });

  const eixoX = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x_min - 1, 0, 0),
    new THREE.Vector3(x_max + 1, 0, 0)
  ]);

  const eixoY = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, y_min - 5, 0),
    new THREE.Vector3(0, y_max + 5, 0)
  ]);

  scene.add(new THREE.Line(eixoX, materialEixo));
  scene.add(new THREE.Line(eixoY, materialEixo));

  // ---------- PONTOS ----------
  x_vals.forEach((xi, idx) => {
    const yi = y_vals[idx];

    const geo = new THREE.SphereGeometry(0.4, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

    const ponto = new THREE.Mesh(geo, mat);
    ponto.position.set(xi, yi, 0);

    scene.add(ponto);
  });

  // ---------- LINHA LIGANDO OS PONTOS ----------
  const pontosOrdenados = x_vals
    .map((x, i) => ({ x: x, y: y_vals[i] }))
    .sort((a, b) => a.x - b.x);

  const pontosLinha = pontosOrdenados.map(p =>
    new THREE.Vector3(p.x, p.y, 0)
  );

  const geoLinha = new THREE.BufferGeometry().setFromPoints(pontosLinha);
  const matLinha = new THREE.LineBasicMaterial({ color: 0x00ffff });

  scene.add(new THREE.Line(geoLinha, matLinha));

  // ---------- PONTO ANIMADO ----------
  const geoAnim = new THREE.SphereGeometry(0.5, 16, 16);
  const matAnim = new THREE.MeshBasicMaterial({ color: 0xffff00 });

  const pontoAnimado = new THREE.Mesh(geoAnim, matAnim);
  scene.add(pontoAnimado);

  let t = x_min;
  const tMax = x_max;

  function animate() {
    requestAnimationFrame(animate);

    t += (x_max - x_min) / 200;
    if (t > tMax) t = x_min;

    // interpolação simples entre pontos
    let y = 0;

    for (let i = 0; i < pontosOrdenados.length - 1; i++) {
      let p1 = pontosOrdenados[i];
      let p2 = pontosOrdenados[i + 1];

      if (t >= p1.x && t <= p2.x) {
        let proporcao = (t - p1.x) / (p2.x - p1.x);
        y = p1.y + proporcao * (p2.y - p1.y);
        break;
      }
    }

    pontoAnimado.position.set(t, y, 0);

    renderer.render(scene, camera);
  }

  animate();

  // ---------- RESPONSIVO ----------
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

</script>
</body>
</html>
