<!DOCTYPE html>
<html>
<head>
<title>Análise de Séries</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
}

/* -------- SIDEBAR -------- */
.sidebar {
  width:250px;
  background:#1e293b;
  padding:10px;
  border-right:1px solid #334155;
}

.sidebar h3 {
  margin-top:0;
}

.json-item {
  padding:8px;
  margin:5px 0;
  background:#334155;
  cursor:pointer;
  border-radius:5px;
}

.json-item:hover {
  background:#38bdf8;
}

/* -------- MAIN -------- */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* -------- TOP -------- */
.topbar {
  padding:10px;
  background:#1e293b;
  display:flex;
  justify-content:space-between;
}

/* -------- INFO -------- */
#info {
  padding:10px;
  background:#020617;
}

/* -------- GRAFICO -------- */
#grafico {
  height:60vh;
}

/* -------- TABELA -------- */
#tabela {
  max-height:200px;
  overflow:auto;
}

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  border:1px solid #334155;
  padding:5px;
  text-align:center;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>📂 Séries</h3>
  <div id="lista"></div>
</div>

<div class="main">

<div class="topbar">
  <button onclick="exportar()">🖼️ Exportar</button>
</div>

<div id="info"></div>
<div id="grafico"></div>
<div id="tabela"></div>

</div>

<script>
const token = "123";
let rendererGlobal;

// -------- LISTA JSON --------
fetch(`/lista_json?token=${token}`)
  .then(res=>res.json())
  .then(lista=>{
    const div = document.getElementById("lista");

    lista.forEach(nome=>{
      const el = document.createElement("div");
      el.className = "json-item";
      el.innerText = nome;

      el.onclick = () => {
        fetch(`/data/${nome}.json?token=${token}`)
          .then(res=>res.json())
          .then(data=>desenhar(data));
      };

      div.appendChild(el);
    });
  });

// -------- DESENHO --------
function desenhar(data){

  document.getElementById("grafico").innerHTML = "";

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth/window.innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true});
  renderer.setSize(window.innerWidth*0.75, window.innerHeight*0.6);
  document.getElementById("grafico").appendChild(renderer.domElement);

  rendererGlobal = renderer;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableRotate = false;

  const x = data.x;
  const y = data.y;

  const a = data.coeficientes.a;
  const b = data.coeficientes.b;
  const c = data.coeficientes.c;

  const x_min = Math.min(...x);
  const x_max = Math.max(...x);

  camera.position.z = (x_max - x_min) * 2;

  // -------- PONTOS --------
  x.forEach((xi,i)=>{
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.3),
      new THREE.MeshBasicMaterial({color:0xff0000})
    );
    p.position.set(xi,y[i],0);
    scene.add(p);
  });

  // -------- CURVA --------
  let curva = [];

  for(let i=0;i<200;i++){
    let xi = x_min + (i/200)*(x_max-x_min);
    let yi = a*xi*xi + b*xi + c;
    curva.push(new THREE.Vector3(xi,yi,0));
  }

  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curva),
    new THREE.LineBasicMaterial({color:0x00ff00})
  ));

  // -------- R² --------
  let yMed = y.reduce((a,b)=>a+b)/y.length;
  let ssTot = y.reduce((s,v)=>s+(v-yMed)**2,0);
  let ssRes = x.reduce((s,xi,i)=>{
    let yi = a*xi*xi + b*xi + c;
    return s + (y[i]-yi)**2;
  },0);

  let r2 = 1 - (ssRes/ssTot);

  // -------- ANÁLISE --------
  let tendencia = "";

  if (a > 0) tendencia = "📈 Tendência de melhora";
  else if (a < 0) tendencia = "📉 Tendência de piora";
  else tendencia = "🔄 Comportamento estável";

  document.getElementById("info").innerHTML = `
    <b>Equação:</b> y=${a.toFixed(2)}x² + ${b.toFixed(2)}x + ${c.toFixed(2)}<br>
    <b>R²:</b> ${r2.toFixed(4)}<br>
    <b>Análise:</b> ${tendencia}
  `;

  // -------- TABELA --------
  let html = "<table><tr><th>Episódio</th><th>Nota</th><th>Previsto</th><th>Erro</th></tr>";

  x.forEach((xi,i)=>{
    let prev = a*xi*xi + b*xi + c;
    let erro = y[i] - prev;

    html += `<tr>
      <td>${xi}</td>
      <td>${y[i]}</td>
      <td>${prev.toFixed(2)}</td>
      <td>${erro.toFixed(2)}</td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById("tabela").innerHTML = html;

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }

  animate();
}

// -------- EXPORTAR --------
function exportar(){
  const link = document.createElement("a");
  link.download = "grafico.png";
  link.href = rendererGlobal.domElement.toDataURL();
  link.click();
}
</script>

</body>
</html>
