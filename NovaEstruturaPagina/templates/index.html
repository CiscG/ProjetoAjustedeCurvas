<!DOCTYPE html>
<html>
<head>
<title>Ajuste de Curvas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #38bdf8;
  --accent2: #22c55e;
  --text: #e2e8f0;
  --muted: #94a3b8;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: var(--text);
}

/* -------- TOPBAR -------- */
.topbar {
  padding: 15px 20px;
  background: rgba(30, 41, 59, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.topbar h2 {
  margin: 0;
  font-size: 20px;
  color: var(--accent);
}

/* -------- CONTAINER -------- */
.container {
  padding: 15px;
}

/* -------- DRAG AREA -------- */
#drop {
  border: 2px dashed #475569;
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  color: var(--muted);
  transition: all 0.3s ease;
  margin-bottom: 15px;
  background: rgba(30, 41, 59, 0.4);
}

#drop:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(56, 189, 248, 0.1);
  transform: scale(1.01);
}

/* -------- INFO -------- */
#info {
  background: var(--card);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

#info b {
  color: var(--accent2);
}

/* -------- GRÁFICO -------- */
#grafico {
  height: 75vh;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
  background: #020617;
}

/* -------- RESPONSIVO -------- */
@media (max-width: 768px) {
  .topbar h2 {
    font-size: 16px;
  }

  #grafico {
    height: 65vh;
  }
}
</style>
</head>

<body>

<div class="topbar">
  <h2>Ajuste de Curvas - Análise de Notas</h2>
</div>

<div class="container">
  <div id="drop">Arraste um JSON aqui</div>
  <div id="info"></div>
  <div id="grafico"></div>
</div>

<script>
const token = "123";
const arquivo_json = "{{ arquivo_json or '' }}";

// ---------------- DRAG DROP ----------------
const drop = document.getElementById("drop");

drop.addEventListener("dragover", e => e.preventDefault());

drop.addEventListener("drop", e => {
  e.preventDefault();

  const file = e.dataTransfer.files[0];
  const reader = new FileReader();

  reader.onload = e => {
    const json = JSON.parse(e.target.result);
    enviar(json);
  };

  reader.readAsText(file);
});

// ---------------- AUTO LOAD ----------------
if (arquivo_json) {
  fetch(arquivo_json)
    .then(res => res.json())
    .then(data => desenhar(data));
}

// ---------------- BACKEND ----------------
function enviar(json) {
  fetch(`/data_temp?token=${token}`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(json)
  })
  .then(res => res.json())
  .then(data => desenhar(data));
}

// ---------------- DESENHO ----------------
function desenhar(data) {

  document.getElementById("grafico").innerHTML = "";

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth/window.innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight * 0.8);
  document.getElementById("grafico").appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableRotate = false;

  const x = data.x;
  const y = data.y;

  const x_min = Math.min(...x);
  const x_max = Math.max(...x);

  camera.position.z = (x_max - x_min) * 2;

  // -------- EQUAÇÃO --------
  const a = data.coeficientes.a;
  const b = data.coeficientes.b;
  const c = data.coeficientes.c;

  document.getElementById("info").innerHTML =
    `<b>Equação:</b> y = ${a.toFixed(2)}x² + ${b.toFixed(2)}x + ${c.toFixed(2)}`;

  // -------- PONTOS --------
  x.forEach((xi,i)=>{
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.3),
      new THREE.MeshBasicMaterial({color:0xff0000})
    );
    p.position.set(xi,y[i],0);
    scene.add(p);
  });

  // -------- CURVA --------
  const pontos = [];

  for(let i=0;i<200;i++){
    let xi = x_min + (i/200)*(x_max-x_min);
    let yi = a*xi*xi + b*xi + c;
    pontos.push(new THREE.Vector3(xi,yi,0));
  }

  const linha = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pontos),
    new THREE.LineBasicMaterial({color:0x00ff00})
  );

  scene.add(linha);

  // -------- ANIMAÇÃO --------
  const bola = new THREE.Mesh(
    new THREE.SphereGeometry(0.4),
    new THREE.MeshBasicMaterial({color:0xffff00})
  );

  scene.add(bola);

  let t = x_min;

  function animate(){
    requestAnimationFrame(animate);

    t += (x_max-x_min)/200;
    if(t > x_max) t = x_min;

    let yv = a*t*t + b*t + c;
    bola.position.set(t,yv,0);

    controls.update();
    renderer.render(scene,camera);
  }

  animate();
}
</script>

</body>
</html>
