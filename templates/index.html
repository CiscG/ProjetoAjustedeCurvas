<!DOCTYPE html>
<html>
<head>
<title>Análise de Desempenho Computacional</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; display:flex; height: 100vh; overflow: hidden; }
.sidebar { width:260px; background:#1e293b; padding:15px; border-right:1px solid #334155; display: flex; flex-direction: column; }
.sidebar h3 { margin-top:0; color: #38bdf8; }
.mode-selector { margin-bottom: 20px; padding: 10px; background: #0f172a; border-radius: 8px; }
.json-item { padding:10px; margin:5px 0; background:#334155; cursor:pointer; border-radius:5px; transition: 0.3s; }
.json-item:hover { background:#38bdf8; color: #0f172a; }
.main { flex:1; display:flex; flex-direction:column; overflow-y: auto; }
.topbar { padding:10px; background:#1e293b; display:flex; justify-content:space-between; align-items: center; border-bottom: 1px solid #334155; }
#info { padding:15px; background:#020617; border-bottom: 1px solid #334155; line-height: 1.6; }
#grafico { height:60vh; background: #000; position: relative; }
#tabela { padding: 10px; overflow:auto; background: #0f172a; }
table { width:100%; border-collapse:collapse; font-size: 13px; }
th, td { border:1px solid #334155; padding:8px; text-align:center; }
th { background: #1e293b; }
.btn-export { background: #0ea5e9; border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
.btn-csv { background: #10b981; } /* Verde para o CSV */
</style>
</head>

<body>

<div class="sidebar">
  <h3>📂 Painel de Controle</h3>
  
  <div class="mode-selector">
    <label style="font-size: 12px; color: #94a3b8;">MODO DE VISUALIZAÇÃO:</label><br>
    <select id="modoAjuste" style="width: 100%; margin-top: 5px; padding: 5px; background: #334155; color: white; border: none;" onchange="recarregarAtual()">
      <option value="padrao">Com Interpolação (Suave)</option>
      <option value="puro">Sem Interpolação (Dados Brutos)</option>
    </select>
  </div>

  <h3>📊 Datasets Computacionais</h3>
  <div id="lista" style="flex: 1; overflow-y: auto;"></div>
</div>

<div class="main">
  <div class="topbar">
    <span id="titulo-arquivo">Selecione um arquivo de desempenho...</span>
    <div class="actions">
        <button class="btn-export" onclick="exportar()">🖼️ PNG</button>
        <button class="btn-export btn-csv" onclick="exportarCSV()">📊 CSV</button>
    </div>
  </div>

  <div id="info">Clique em um dataset para visualizar o comportamento computacional.</div>
  <div id="grafico"></div>
  <div id="tabela"></div>
</div>

<script>
const token = "123";
let rendererGlobal, cenaGlobal, cameraGlobal, jsonAtual = null;

// Carregar lista de arquivos
fetch(`/lista_json?token=${token}`)
  .then(res=>res.json())
  .then(lista=>{
    const div = document.getElementById("lista");
    lista.forEach(nome=>{
      const el = document.createElement("div");
      el.className = "json-item";
      el.innerText = nome.replace(/_/g, " ").toUpperCase();
      el.onclick = () => { jsonAtual = nome; carregarDados(nome); };
      div.appendChild(el);
    });
  });

function recarregarAtual() {
    if (jsonAtual) carregarDados(jsonAtual);
}

function carregarDados(nome) {
  const modo = document.getElementById("modoAjuste").value;
  const url = modo === "puro" 
    ? `/api/ajuste-puro/${nome}?token=${token}` 
    : `/data/${nome}.json?token=${token}`;

  document.getElementById("titulo-arquivo").innerText = `Dataset: ${nome.toUpperCase()} | Modo: ${modo === 'padrao' ? 'Suavizado' : 'Bruto'}`;

  fetch(url)
    .then(res=>res.json())
    .then(data => desenhar(data, modo));
}

function desenhar(data, modo){
  const container = document.getElementById("grafico");
  container.innerHTML = "";

  const scene = new THREE.Scene();
  const width = container.clientWidth;
  const height = container.clientHeight;

  const camera = new THREE.PerspectiveCamera(75, width/height, 0.1, 100000);
  const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer:true, antialias: true});
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  rendererGlobal = renderer;
  cenaGlobal = scene;
  cameraGlobal = camera;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  
  const x = data.x;
  const y = data.y;
  const {a, b, c} = data.coeficientes;
  
  // AJUSTE 1: Prioriza a equação formatada vinda do Python
  const equacaoParaExibir = data.equacao || `y = ${a.toExponential(2)}x² + ${b.toExponential(2)}x + ${c.toFixed(2)}`;
  
  const r2 = data.r2 || calcularR2Manual(x, y, a, b, c);

  const x_min = Math.min(...x);
  const x_max = Math.max(...x);
  const y_min = Math.min(...y);
  const y_max = Math.max(...y);
  const centerX = (x_max + x_min) / 2;
  const centerY = (y_max + y_min) / 2;
  const scaleZoom = Math.max(x_max - x_min, y_max - y_min);

  camera.position.set(centerX, centerY, scaleZoom * 1.2 || 10);
  controls.target.set(centerX, centerY, 0);

  const raioEsfera = scaleZoom * 0.01 || 0.5;
  const orderPoints = x.map((xi, i) => ({x: xi, y: y[i]})).sort((p1, p2) => p1.x - p2.x);
  
  orderPoints.forEach(pt => {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(raioEsfera),
      new THREE.MeshBasicMaterial({color: 0xff4444})
    );
    p.position.set(pt.x, pt.y, 0);
    scene.add(p);
  });

  function gerarCurvaSuave() {
      let pontos = [];
      for(let i=0; i<=200; i++){
          let xi = x_min + (i/200) * (x_max - x_min);
          let yi = a*xi*xi + b*xi + c;
          pontos.push(new THREE.Vector3(xi, yi, 0));
      }
      return pontos;
  }

  if (modo === "padrao") {
      const curvaPoints = gerarCurvaSuave();
      const linhaCurva = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(curvaPoints),
          new THREE.LineBasicMaterial({color: 0x38bdf8, linewidth: 2})
      );
      scene.add(linhaCurva);
  } else {
      let rawPoints = orderPoints.map(pt => new THREE.Vector3(pt.x, pt.y, 0));
      const linhaBruta = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(rawPoints),
          new THREE.LineBasicMaterial({color: 0xff4444, linewidth: 2})
      );
      scene.add(linhaBruta);

      const curvaPoints = gerarCurvaSuave();
      const refMaterial = new THREE.LineDashedMaterial({ 
          color: 0x38bdf8, 
          dashSize: scaleZoom/50, 
          gapSize: scaleZoom/50 
      });
      const refGeom = new THREE.BufferGeometry().setFromPoints(curvaPoints);
      const refLine = new THREE.Line(refGeom, refMaterial);
      refLine.computeLineDistances();
      scene.add(refLine);
  }

  let analise = a > 0 ? "O custo computacional acelera (crescimento de 2º grau)." : "O sistema atinge um pico/platô (inversão da parábola).";

  // AJUSTE 1 APLICADO AQUI NO INNERHTML
  document.getElementById("info").innerHTML = `
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div><b>Regressão:</b> <span style="color:#38bdf8">${equacaoParaExibir}</span></div>
        <div><b>Coeficiente R²:</b> <span style="color:#10b981">${(r2 * 100).toFixed(2)}%</span></div>
    </div>
    <div style="margin-top: 5px;"><b>Comportamento:</b> ${analise}</div>
  `;

  let htmlTabela = "<table id='tabela-dados'><tr><th>Entrada (X)</th><th>Valor Real (Y)</th><th>Valor Ajustado</th><th>Resíduo</th></tr>";
  orderPoints.forEach(pt =>{
    let prev = a*pt.x*pt.x + b*pt.x + c;
    let erro = pt.y - prev;
    htmlTabela += `<tr><td>${pt.x}</td><td>${pt.y.toFixed(2)}</td><td>${prev.toFixed(2)}</td><td style="color:${erro<0?'#f87171':'#10b981'}">${erro.toFixed(4)}</td></tr>`;
  });
  document.getElementById("tabela").innerHTML = htmlTabela + "</table>";

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

function calcularR2Manual(x, y, a, b, c) {
    let yMed = y.reduce((acc,val)=>acc+val)/y.length;
    let ssTot = y.reduce((s,v)=>s+(v-yMed)**2,0);
    let ssRes = x.reduce((s,xi,i)=>{
        let yi = a*xi*xi + b*xi + c;
        return s + (y[i]-yi)**2;
    },0);
    return ssTot === 0 ? 1 : 1 - (ssRes/ssTot);
}

function exportar(){
  if(!rendererGlobal) return;
  const link = document.createElement("a");
  link.download = "analise_computacional.png";
  link.href = rendererGlobal.domElement.toDataURL();
  link.click();
}

// AJUSTE 6: Função de exportação para CSV
function exportarCSV() {
    let csv = [];
    const rows = document.querySelectorAll("#tabela-dados tr");
    
    for (const row of rows) {
        const cells = row.querySelectorAll("th, td");
        const rowData = Array.from(cells).map(cell => `"${cell.innerText.replace('.', ',')}"`);
        csv.push(rowData.join(";")); // Usando ponto-e-vírgula para facilitar abertura no Excel BR
    }

    const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csv.join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `exportacao_${jsonAtual || 'dados'}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

window.addEventListener('resize', () => {
    if(cameraGlobal && rendererGlobal) {
        const container = document.getElementById("grafico");
        cameraGlobal.aspect = container.clientWidth / container.clientHeight;
        cameraGlobal.updateProjectionMatrix();
        rendererGlobal.setSize(container.clientWidth, container.clientHeight);
    }
});
</script>
</body>
</html>
