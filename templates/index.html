<!DOCTYPE html>
<html>
<head>
  <title>Ajuste de Curva</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body style="margin:0; background:black; color:white;">
<h2 style="position:absolute; top:10px; left:10px;">Ajuste de Curva com Animação</h2>

<script>
  // Flask injeta a URL correta do JSON (ex: "/data/dados1.json?token=123")
  const arquivo_json = "{{ arquivo_json }}";

  // ------------------ Requisição ------------------
  fetch(arquivo_json)
    .then(res => res.json())
    .then(dados => iniciarCena(dados))
    .catch(err => console.error("Erro ao carregar JSON:", err));

  // ------------------ Função principal ------------------
  function iniciarCena(dados) {

    // ---------- CENA ----------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 20;

    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------- EIXOS ----------
    const materialEixo = new THREE.LineBasicMaterial({ color: 0xffffff });

    const eixoX = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-10, 0, 0),
      new THREE.Vector3(10, 0, 0)
    ]);

    const eixoY = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -40, 0),
      new THREE.Vector3(0, 40, 0)
    ]);

    scene.add(new THREE.Line(eixoX, materialEixo));
    scene.add(new THREE.Line(eixoY, materialEixo));

    // ---------- PONTOS EXPERIMENTAIS ----------
    const pontos = dados.x.map((xi, i) => [xi, dados.y[i]]);
    pontos.forEach(p => {
      const geo = new THREE.SphereGeometry(0.2);
      const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const ponto = new THREE.Mesh(geo, mat);
      ponto.position.set(p[0], p[1], 0);
      scene.add(ponto);
    });

    // ---------- CURVA ----------
    const a = 0.5, b = 0.1, c = -1; // coeficientes do ajuste
    const curva = dados.x.map(xi => [xi, a*xi*xi + b*xi + c]);
    const pontosCurva = curva.map(p => new THREE.Vector3(p[0], p[1], 0));

    const geoCurva = new THREE.BufferGeometry().setFromPoints(pontosCurva);
    const matCurva = new THREE.LineBasicMaterial({ color: 0x0000ff });
    scene.add(new THREE.Line(geoCurva, matCurva));

    // ---------- PONTO ANIMADO ----------
    const geoAnim = new THREE.SphereGeometry(0.3);
    const matAnim = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    const pontoAnimado = new THREE.Mesh(geoAnim, matAnim);
    scene.add(pontoAnimado);

    // ---------- ANIMAÇÃO ----------
    let t = Math.min(...dados.x);
    const tMax = Math.max(...dados.x);

    function animate() {
      requestAnimationFrame(animate);

      t += 0.03;
      if (t > tMax) t = Math.min(...dados.x);

      const y = a*t*t + b*t + c;
      pontoAnimado.position.set(t, y, 0);

      renderer.render(scene, camera);
    }

    animate();
  }
</script>

</body>
</html>
